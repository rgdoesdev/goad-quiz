<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #f0f2f5; margin: 0; }
        .container { background: white; padding: 2rem; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); text-align: center; width: 350px; }
        .dice-area { display: flex; justify-content: space-around; margin: 20px 0; }
        .die { width: 120px; height: 120px; border: 2px solid #333; border-radius: 12px; display: flex; align-items: center; justify-content: center; font-weight: bold; background: #fff; padding: 10px; box-sizing: border-box; font-size: 1.1rem; }
        .label { font-size: 0.8rem; color: #666; margin-bottom: 5px; }
        button { background: #007bff; color: white; border: none; padding: 12px 24px; border-radius: 5px; cursor: pointer; font-size: 1rem; transition: 0.2s; }
        button:hover { background: #0056b3; }
        #result-summary { margin-top: 20px; font-weight: bold; color: #2c3e50; min-height: 50px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ Vacation Roulette</h2>
    
    <div class="dice-area">
        <div>
            <div class="label">DESTINATION</div>
            <div id="dest-die" class="die">?</div>
        </div>
        <div>
            <div class="label">DURATION</div>
            <div id="dur-die" class="die">?</div>
        </div>
    </div>

    <button onclick="rollDice()">Roll the Fate!</button>

    <div id="result-summary"></div>
</div>

<script>
    const destinations = ["Portugal", "Portugal", "Italy", "Italy", "Spain", "Spain"];
    const durations = ["5 Days", "7 Days", "9 Days", "10 Days", "10 Days + Another Country", "Retry Country"];

    function rollDice() {
        const destDie = document.getElementById('dest-die');
        const durDie = document.getElementById('dur-die');
        const summary = document.getElementById('result-summary');

        // Add a simple "shake" animation effect via text
        destDie.innerText = "🎲";
        durDie.innerText = "🎲";

        setTimeout(() => {
            const finalDest = destinations[Math.floor(Math.random() * destinations.length)];
            const finalDur = durations[Math.floor(Math.random() * durations.length)];

            destDie.innerText = finalDest;
            durDie.innerText = finalDur;

            // Logic for special values
            if (finalDur === "Retry Country") {
                summary.innerText = `You're going for ${finalDur}! Roll the destination again.`;
            } else if (finalDur === "10 Days + Another Country") {
                summary.innerText = `Pack your bags! ${finalDest} plus a mystery neighbor for 10+ days!`;
            } else {
                summary.innerText = `Pack for ${finalDur} in ${finalDest}!`;
            }
        }, 300);
    }
</script>

</body>
</html>
