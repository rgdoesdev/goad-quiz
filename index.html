<!DOCTYPE html>
<html>
<head>
    <style>
        body { font-family: 'Segoe UI', Tahoma, sans-serif; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; background-color: #eef2f3; margin: 0; }
        .container { background: white; padding: 2.5rem; border-radius: 20px; box-shadow: 0 15px 35px rgba(0,0,0,0.2); text-align: center; width: 400px; }
        
        .dice-area { display: flex; justify-content: space-around; margin: 30px 0; }
        .die { 
            width: 140px; height: 140px; border: 3px solid #333; border-radius: 18px; 
            display: flex; align-items: center; justify-content: center; 
            font-weight: bold; background: #fff; font-size: 1.2rem; transition: transform 0.1s;
            box-shadow: inset 0 0 10px rgba(0,0,0,0.05); color: #333;
        }

        /* The Shake Animation */
        .shaking { animation: shake 0.15s infinite; color: #007bff; border-color: #007bff; }
        @keyframes shake {
            0% { transform: translate(2px, 1px) rotate(0deg); }
            20% { transform: translate(-1px, -2px) rotate(-1deg); }
            40% { transform: translate(-3px, 0px) rotate(1deg); }
            60% { transform: translate(3px, 2px) rotate(0deg); }
            80% { transform: translate(1px, -1px) rotate(1deg); }
            100% { transform: translate(-1px, 2px) rotate(-1deg); }
        }

        button { background: #28a745; color: white; border: none; padding: 15px 30px; border-radius: 8px; cursor: pointer; font-size: 1.1rem; font-weight: bold; width: 100%; }
        button:disabled { background: #ccc; cursor: not-allowed; }
        #status { margin-top: 15px; font-style: italic; color: #666; height: 20px; }
        #summary { margin-top: 20px; font-size: 1.2rem; font-weight: bold; color: #d9534f; min-height: 60px; }
    </style>
</head>
<body>

<div class="container">
    <h2>✈️ Vacation Roulette</h2>
    <p>The 10-Second Countdown to Fate</p>
    
    <div class="dice-area">
        <div id="dest-die" class="die">READY</div>
        <div id="dur-die" class="die">READY</div>
    </div>

    <button id="rollBtn" onclick="startLongRoll()">ROLL THE DICE</button>
    <div id="status"></div>
    <div id="summary"></div>
</div>

<script>
    const destinations = ["Portugal", "Portugal", "Italy", "Italy", "Spain", "Spain"];
    const durations = ["5 Days", "7 Days", "9 Days", "10 Days", "10 Days + Another", "Retry Country"];

    function startLongRoll() {
        const destDie = document.getElementById('dest-die');
        const durDie = document.getElementById('dur-die');
        const btn = document.getElementById('rollBtn');
        const summary = document.getElementById('summary');
        const status = document.getElementById('status');

        // Reset UI
        btn.disabled = true;
        summary.innerText = "";
        destDie.classList.add('shaking');
        durDie.classList.add('shaking');
        
        let secondsLeft = 10;
        status.innerText = `Deciding your future... (${secondsLeft}s)`;

        // Interval to change text rapidly (the "blur" effect)
        const rollInterval = setInterval(() => {
            destDie.innerText = destinations[Math.floor(Math.random() * destinations.length)];
            durDie.innerText = durations[Math.floor(Math.random() * durations.length)];
        }, 100);

        // Interval to update the countdown text every second
        const countdownInterval = setInterval(() => {
            secondsLeft--;
            if(secondsLeft > 0) status.innerText = `Deciding your future... (${secondsLeft}s)`;
        }, 1000);

        // The Stop Logic (10 seconds)
        setTimeout(() => {
            clearInterval(rollInterval);
            clearInterval(countdownInterval);
            
            destDie.classList.remove('shaking');
            durDie.classList.remove('shaking');
            btn.disabled = false;
            status.innerText = "THE RESULTS ARE IN!";

            const finalDest = destDie.innerText;
            const finalDur = durDie.innerText;

            if (finalDur === "Retry Country") {
                summary.innerText = `Fate says ${finalDur}! Keep the duration, but roll for a new country.`;
            } else if (finalDur === "10 Days + Another") {
                summary.innerText = `PACK HEAVY! ${finalDest} + another surprise country!`;
            } else {
                summary.innerText = `You're going to ${finalDest} for ${finalDur}!`;
            }
        }, 10000); 
    }
</script>

</body>
</html>
